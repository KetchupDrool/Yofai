name: Yofai
options:
  bundleIdPrefix: com.shawnwright
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: "5.0"
  TARGETED_DEVICE_FAMILY: "1"
targets:
  Yofai:
    type: application
    platform: iOS
    sources:
      - path: Yofai
        excludes:
          - Info.plist
    info:
      path: Yofai/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
          UIImageRespectsSafeAreaInsets: false
        CFBundleDisplayName: Yofai
        UIApplicationSceneManifest_Generation: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryAddUsageDescription: Yofai saves a listing-ready photo copy to Photos only when you tap Save Listing Copy.
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.shawnwright.yofai.etsy-oauth
            CFBundleURLSchemes:
              - yofai
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.shawnwright.yofai
      PRODUCT_NAME: Yofai
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
      TARGETED_DEVICE_FAMILY: "1"
      SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
      SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
      GENERATE_INFOPLIST_FILE: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      SWIFT_STRICT_CONCURRENCY: complete
      ENABLE_TESTABILITY: YES
  YofaiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: YofaiTests
    dependencies:
      - target: Yofai
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.shawnwright.yofai.tests
      GENERATE_INFOPLIST_FILE: YES
      TARGETED_DEVICE_FAMILY: "1"
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Yofai.app/Yofai"
      BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Yofai:
    build:
      targets:
        Yofai: all
        YofaiTests: [test]
    test:
      targets:
        - YofaiTests
